<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' | Community Clinic'">Community Clinic</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
</head>
<body>
<nav th:fragment="nav" class="navbar navbar-expand navbar-dark bg-primary mb-3 px-3">
  <a class="navbar-brand" th:href="@{/}"><i class="fa-solid fa-house-medical"></i> Community Clinic</a>
  <ul class="navbar-nav me-auto">
    <th:block sec:authorize="hasRole('RECEPTIONIST')">
      <li class="nav-item"><a class="nav-link" th:href="@{/reception/patients}"><i class="fa-solid fa-users"></i> Patients</a></li>
      <li class="nav-item"><a class="nav-link" th:href="@{/reception/appointments}"><i class="fa-solid fa-calendar-check"></i> Appointments</a></li>
      <li class="nav-item"><a class="nav-link" th:href="@{/reception/queue}"><i class="fa-solid fa-list-ol"></i> Live queue</a></li>
    </th:block>
    <th:block sec:authorize="hasRole('CLINICIAN')">
      <li class="nav-item"><a class="nav-link" th:href="@{/clinician/queue}"><i class="fa-solid fa-user-doctor"></i> My queue</a></li>
    </th:block>
    <th:block sec:authorize="hasRole('MANAGER')">
      <li class="nav-item"><a class="nav-link" th:href="@{/manager/dashboard}"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
    </th:block>
  </ul>
  <span class="navbar-text me-3"><i class="fa-solid fa-circle-user"></i> <span sec:authentication="name">user</span></span>
  <form th:action="@{/logout}" method="post" class="m-0">
    <button class="btn btn-sm btn-outline-light" type="submit">Sign out</button>
  </form>
</nav>
<div th:fragment="flash">
  <div th:if="${error}" class="alert alert-danger" role="alert"><i class="fa-solid fa-triangle-exclamation"></i> <span th:text="${error}"></span></div>
  <div th:if="${success}" class="alert alert-success" role="alert"><i class="fa-solid fa-circle-check"></i> <span th:text="${success}"></span></div>
</div>
</body>
</html>
