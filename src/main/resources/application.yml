spring:
  application:
    name: clinic-queue-system
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:clinic}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:Tycoonmaster2}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQLDialect
  threads:
    virtual:
      enabled: true
  thymeleaf:
    cache: false

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

clinic:
  slot:
    allowed-durations: [15, 30, 60]   # configurable slot lengths (minutes)
    default-duration: 30
    open-time: "08:00"
    close-time: "17:00"
  queue:
    default-visit-minutes: 15         # used until a clinician has visit history
    delay-alert-minutes: 30           # EWT at/above which a delay alert is sent
  seed:
    enabled: true
    password: "Clinic#2026"

logging:
  level:
    com.clinic: INFO
